[project]
name = "dynatrace-triage"
version = "0.1.0"
description = "Triage determinístico de problems de Dynatrace, con escalamiento a ServiceNow, agente en Microsoft Foundry y orquestador en Copilot Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6",
]

[project.optional-dependencies]
foundry = [
    "azure-ai-agents>=1.1,<2",
    "azure-identity>=1.17",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
triage = "dynatrace_triage.cli:main"
foundry-setup = "dynatrace_triage.foundry.setup_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynatrace_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No depende del .pth de la instalación editable (macOS puede marcarlo oculto y Python 3.13 lo ignora).
pythonpath = ["src"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: usa el tenant real de Dynatrace/ServiceNow (requiere .env); se omite por defecto",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# El ancho lo controla `ruff format`; los mensajes largos en español no se cortan.
ignore = ["E501"]
